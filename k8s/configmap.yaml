apiVersion: v1
kind: ConfigMap
metadata:
  name: lctmr-config
  namespace: czl-test
  labels:
    app: lctmr
    environment: production
data:
  # 应用环境配置
  NODE_ENV: "production"
  PORT: "3001"
  
  # API 服务配置
  API_URL: "/api"
  FRONTEND_URL: "http://lctmr-frontend-service:80"
  BACKEND_URL: "http://lctmr-backend-service:3001"
  
  # 数据库配置
  DB_HOST: "101.32.59.153"
  DB_PORT: "5432"
  DB_USER: "web_app"
  DB_NAME: "lctmr_production"
  DB_SSL: "false"
  DB_CONNECTION_LIMIT: "50"
  DB_IDLE_TIMEOUT: "30000"
  DB_CONNECTION_TIMEOUT: "10000"
  
  # JWT 配置
  JWT_EXPIRES_IN: "24h"
  
  # Kubernetes 环境标识
  KUBERNETES_SERVICE_HOST: "kubernetes.default.svc.cluster.local"
  KUBERNETES_ENV: "true"
