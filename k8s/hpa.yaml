apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lctmr-backend-hpa
  namespace: czl-test
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lctmr-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lctmr-frontend-hpa
  namespace: czl-test
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lctmr-frontend
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
