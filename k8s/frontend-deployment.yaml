apiVersion: apps/v1
kind: Deployment
metadata:
  name: lctmr-frontend
  namespace: czl-test
  labels:
    app: lctmr-frontend
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lctmr-frontend
  template:
    metadata:
      labels:
        app: lctmr-frontend
        version: v1
    spec:
      containers:
      - name: frontend
        image: harbor.cosmo-lady.com/lctmr-frontend/lctmr-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        env:
        - name: API_URL
          valueFrom:
            configMapKeyRef:
              name: lctmr-config
              key: API_URL
        - name: FRONTEND_URL
          valueFrom:
            configMapKeyRef:
              name: lctmr-config
              key: FRONTEND_URL
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: lctmr-config
              key: NODE_ENV
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      restartPolicy: Always
